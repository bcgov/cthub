apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: cthub-vinpower
parameters:
  - name: NAME
    description: Module name
    value: cthub
    required: true
  - name: COMPONENT
    description: Component name
    value: vinpower
    required: true
  - name: ZONE
    description: Deployment zone, e.g. pr-123, dev, test, prod
    required: true
  - name: IMAGE_TAG
    description: Container image tag or digest
    required: true
  - name: REGISTRY
    description: Container registry
    value: ghcr.io
  - name: ORG_NAME
    description: Organization or owner name
    value: bcgov
  - name: CPU_REQUEST
    value: "10m"
  - name: MEMORY_REQUEST
    value: "400Mi"
  - name: MEMORY_LIMIT
    value: "1Gi"
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}
      labels:
        app: ${NAME}-${ZONE}
        deployment: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      replicas: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          terminationGracePeriodSeconds: 30
          containers:
            - name: vinpower
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/vinpower:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 8080
                  protocol: TCP
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                limits:
                  memory: ${MEMORY_LIMIT}
              env:
                - name: SERVER_PORT
                  value: "8080"
              readinessProbe:
                tcpSocket:
                  port: 8080
                initialDelaySeconds: 40
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 6
              livenessProbe:
                tcpSocket:
                  port: 8080
                initialDelaySeconds: 60
                periodSeconds: 15
                timeoutSeconds: 3
                failureThreshold: 6
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}
      labels:
        app: ${NAME}-${ZONE}
        deployment: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 8080
          protocol: TCP
          targetPort: 8080
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
