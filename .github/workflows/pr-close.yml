name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    name: PR Cleanup
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bcgov/actions-openshift/cleanup-pr@47805d2fc4e919382757c1fbeb68d39313abe64f # v0.11.0
        with:
          cleanup: label
          cleanup_name: cthub-pr-${{ github.event.number }}
          target: pr-${{ github.event.number }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}

  results:
    name: Cleanup Results
    needs: [cleanup]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@acc058abf85bb183dad21b839a92a40a4ff47af3 # v0.14.0
        with:
          needs: ${{ toJson(needs) }}
