name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  builds:
    name: Builds (${{ matrix.package }})
    permissions:
      packages: write
      id-token: write
      attestations: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        package: [backend, frontend, task-queue, vinpower]
        include:
          - package: backend
            context: django
            file: django/Dockerfile-Openshift
            triggers: |
              django/
              .github/workflows/pr-open.yml
          - package: frontend
            context: frontend
            file: frontend/Dockerfile-Openshift
            triggers: |
              frontend/
              .github/workflows/pr-open.yml
          - package: task-queue
            context: django
            file: django/Dockerfile.taskq.Openshift
            triggers: |
              django/
              .github/workflows/pr-open.yml
          - package: vinpower
            context: spring
            file: spring/Dockerfile-Openshift
            triggers: |
              spring/
              .github/workflows/pr-open.yml
    steps:
      - name: Log in to Artifactory (remote proxy)
        env:
          ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
        if: env.ARTIFACTORY_API_KEY != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.ARTIFACTORY_REGISTRY }}
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_API_KEY }}

      - uses: bcgov/actions/builder@77e7b21eda7c99a2230a6dfb4db3b33947678307 # v0.11.0
        with:
          package: ${{ matrix.package }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          triggers: ${{ matrix.triggers }}
          tags: |
            ${{ github.event.number }}
            ${{ github.event.pull_request.head.sha }}
          tag_fallback: latest

  deploys:
    name: Deploys (${{ matrix.name }})
    needs: [builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        name: [vinpower, backend, task-queue, frontend]
        include:
          - name: vinpower
            file: openshift/vinpower.deploy.yml
          - name: backend
            file: openshift/backend.deploy.yml
          - name: task-queue
            file: openshift/task-queue.deploy.yml
          - name: frontend
            file: openshift/frontend.deploy.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ secrets.OPENSHIFT_NAMESPACE_PLATE }}-dev
          oc_server: ${{ secrets.OPENSHIFT_SERVER }}
          oc_token: ${{ secrets.OPENSHIFT_TOKEN }}
          parameters: -p ZONE="pr-${{ github.event.number }}" -p NAME="cthub" -p IMAGE_TAG="${{ github.event.pull_request.head.sha }}"
          triggers: |
            django/
            frontend/
            spring/
            openshift/
            .github/workflows/pr-open.yml

  comment:
    name: Deployment Links
    needs: [deploys]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Post Deploy Links
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-deployment-links
          message: |
            ### 🚀 Deployments Available (PR #${{ github.event.number }})
            - [Frontend](https://cthub-pr-${{ github.event.number }}.apps.silver.devops.gov.bc.ca)
            - [Backend](https://cthub-pr-${{ github.event.number }}-backend.apps.silver.devops.gov.bc.ca/api)

  results:
    name: PR Results
    needs: [builds, deploys, comment]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@77e7b21eda7c99a2230a6dfb4db3b33947678307 # v0.11.0
        with:
          needs: ${{ toJson(needs) }}
