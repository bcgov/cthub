name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  builds:
    name: Builds (${{ matrix.package }})
    permissions:
      packages: write
      id-token: write
      attestations: write
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      matrix:
        package: [backend, frontend, task-queue]
        include:
          - package: backend
            context: django
            file: django/Dockerfile-Openshift
            triggers: |
              django/
              .github/workflows/pr-open.yml
          - package: frontend
            context: frontend
            file: frontend/Dockerfile-Openshift
            triggers: |
              frontend/
              .github/workflows/pr-open.yml
          - package: task-queue
            context: django
            file: django/Dockerfile.taskq.Openshift
            triggers: |
              django/
              .github/workflows/pr-open.yml
          # vinpower pending ARTIFACTORY_URL secret access
          # - package: vinpower
          #   context: spring
          #   file: spring/Dockerfile-Openshift
          #   triggers: |
          #     spring/
          #     .github/workflows/pr-open.yml
    steps:
      - uses: bcgov/actions/builder@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          package: ${{ matrix.package }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          triggers: ${{ matrix.triggers }}
          tags: |
            ${{ github.event.number }}
            ${{ github.event.pull_request.head.sha }}
          tag_fallback: latest

  deploy-database:
    name: Deploy Database
    needs: [builds]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: openshift/database.deploy.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          parameters: -p ZONE="pr-${{ github.event.number }}" -p NAME="cthub"
          triggers: |
            django/
            frontend/
            spring/
            openshift/
            .github/workflows/pr-open.yml

  deploys:
    name: Deploys (${{ matrix.name }})
    needs: [builds, deploy-database]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      matrix:
        name: [backend, task-queue, frontend]
        include:
          # vinpower pending ARTIFACTORY_URL secret access
          # - name: vinpower
          #   file: openshift/vinpower.deploy.yml
          - name: backend
            file: openshift/backend.deploy.yml
            parameters: >-
              -p DB_HOST_SECRET_NAME="cthub-pr-${{ github.event.number }}-database"
              -p DB_HOST_KEY="database-host"
              -p DB_PORT_KEY="database-port"
              -p DB_NAME_SECRET_NAME="cthub-pr-${{ github.event.number }}-database"
              -p DB_NAME_KEY="database-name"
              -p DB_USER_KEY="database-user"
              -p DB_PASSWORD_KEY="database-password"
          - name: task-queue
            file: openshift/task-queue.deploy.yml
            parameters: >-
              -p DB_HOST_SECRET_NAME="cthub-pr-${{ github.event.number }}-database"
              -p DB_HOST_KEY="database-host"
              -p DB_PORT_KEY="database-port"
              -p DB_NAME_SECRET_NAME="cthub-pr-${{ github.event.number }}-database"
              -p DB_NAME_KEY="database-name"
              -p DB_USER_KEY="database-user"
              -p DB_PASSWORD_KEY="database-password"
          - name: frontend
            file: openshift/frontend.deploy.yml
            parameters: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          parameters: -p ZONE="pr-${{ github.event.number }}" -p NAME="cthub" -p IMAGE_TAG="${{ github.event.pull_request.head.sha }}" ${{ matrix.parameters }}
          triggers: |
            django/
            frontend/
            spring/
            openshift/
            .github/workflows/pr-open.yml

  tests:
    name: Health Check
    needs: [deploys]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bcgov/actions/diff-triggers@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        id: triggers
        with:
          triggers: |
            django/
            frontend/
            spring/
            openshift/
            .github/workflows/pr-open.yml
      - name: Wait for backend healthcheck
        if: steps.triggers.outputs.triggered == 'true'
        run: |
          URL="https://cthub-pr-${{ github.event.number }}-backend.apps.silver.devops.gov.bc.ca/api/healthcheck"
          echo "Waiting for backend healthcheck at $URL..."
          for i in {1..30}; do
            status=$(curl -k --connect-timeout 5 --max-time 10 -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$status" -eq 200 ]; then
              echo "Backend is healthy (HTTP 200)!"
              exit 0
            fi
            echo "Waiting for healthcheck (HTTP $status), retrying in 10s... ($i/30)"
            sleep 10
          done
          echo "ERROR: Backend did not become healthy within 5 minutes."
          exit 1

  comment:
    name: Deployment Links
    needs: [deploys, tests]
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bcgov/actions/diff-triggers@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        id: triggers
        with:
          triggers: |
            django/
            frontend/
            spring/
            openshift/
            .github/workflows/pr-open.yml
      - name: Post Deploy Links
        if: steps.triggers.outputs.triggered == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-deployment-links
          message: |
            ### 🚀 Deployments Available (PR #${{ github.event.number }})
            - [Frontend](https://cthub-pr-${{ github.event.number }}.apps.silver.devops.gov.bc.ca)
            - [Backend](https://cthub-pr-${{ github.event.number }}-backend.apps.silver.devops.gov.bc.ca)

  results:
    name: PR Results
    needs: [builds, deploy-database, deploys, tests, comment]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          needs: ${{ toJson(needs) }}
