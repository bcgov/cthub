name: Analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  trivy:
    name: Trivy Security Scan
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivycache
          key: ${{ runner.os }}-trivy-${{ hashFiles('.github/workflows/analysis.yml') }}

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,misconfig"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          cache-dir: .trivycache
          skip-dirs: "**/node_modules,**/coverage,**/dist,.git,spring"
          exit-code: "0"

      - name: Upload Trivy scan results to GitHub Security tab (PR)
        if: always() && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "trivy"
          sarif_file: "trivy-results.sarif"
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "trivy"
          sarif_file: "trivy-results.sarif"

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cthub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bcgov/actions/test-and-analyse@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: cthub
          DB_USER: postgres
          DB_PASSWORD: postgres
          DJANGO_SECRET_KEY: test-secret-key-for-unit-tests
          KEYCLOAK_TESTING: "True"
        with:
          language: python
          python_version: "3.13"
          working_directory: django
          commands: |
            sudo apt-get update -qq && sudo apt-get install -y -qq build-essential libpq-dev
            pip install --upgrade pip
            pip install -r requirements.txt
            python manage.py test api --noinput
          triggers: |
            django/
            .github/workflows/analysis.yml

  results:
    name: Analysis Results
    needs: [trivy, backend-tests]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          needs: ${{ toJson(needs) }}
