name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/**"
      - "!.github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-26.04
    steps:
      - id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1

  deploys:
    name: TEST Deploys (${{ matrix.name }})
    needs: [init]
    environment: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      matrix:
        name: [backend, task-queue, frontend]
        include:
          - name: backend
            file: openshift/backend.deploy.yml
            parameters: -p ZONE="test" -p NAME="cthub" -p IMAGE_TAG="${{ needs.init.outputs.pr || github.sha }}" -p CRUNCHY_SECRET_NAME="cthub-test-crunchy-pguser-postgres" -p DB_HOST_SECRET_NAME="cthub-test-crunchy-pguser-postgres" -p MINIO_BUCKET_NAME="zevats" -p ENABLE_KEYCLOAK="true"
          - name: task-queue
            file: openshift/task-queue.deploy.yml
            parameters: -p ZONE="test" -p NAME="cthub" -p IMAGE_TAG="${{ needs.init.outputs.pr || github.sha }}" -p CRUNCHY_SECRET_NAME="cthub-test-crunchy-pguser-postgres" -p DB_HOST_SECRET_NAME="cthub-test-crunchy-pguser-postgres" -p MINIO_BUCKET_NAME="zevats"
          - name: frontend
            file: openshift/frontend.deploy.yml
            parameters: -p ZONE="test" -p NAME="cthub" -p IMAGE_TAG="${{ needs.init.outputs.pr || github.sha }}" -p ENABLE_KEYCLOAK="true" -p KEYCLOAK_URL="https://test.loginproxy.gov.bc.ca/auth/"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          parameters: ${{ matrix.parameters }}

  results:
    name: Merge Results
    needs: [init, deploys]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          needs: ${{ toJson(needs) }}
